name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv run fci-breeds export tests/fixtures/catalogue.json --output build/fixture-api
      - run: npm run check -- --assets build/fixture-api
      - name: Check local Cloudflare serving
        run: |
          npm run dev -- --assets build/fixture-api > /tmp/wrangler.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          uv run python scripts/smoke.py http://localhost:8787
