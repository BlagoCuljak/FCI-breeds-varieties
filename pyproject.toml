[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fci-breeds-varieties"
version = "0.1.0"
description = "Official FCI breed catalogue and varieties, published as a nightly static API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.scripts]
fci-breeds = "fci_breeds.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/fci_breeds"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
